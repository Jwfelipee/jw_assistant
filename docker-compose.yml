services:
  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jw}
      POSTGRES_DB: ${POSTGRES_DB:-jw_assistant}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jw} -d ${POSTGRES_DB:-jw_assistant}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jw}:${POSTGRES_PASSWORD:-jw}@db:5432/${POSTGRES_DB:-jw_assistant}?schema=public
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      CONGREGATION_NAME: ${CONGREGATION_NAME:-Congregação (placeholder)}
      MEETING_WEEKDAY: ${MEETING_WEEKDAY:-THURSDAY}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-jw}:${POSTGRES_PASSWORD:-jw}@db:5432/${POSTGRES_DB:-jw_assistant}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      # Local compose is HTTP; keep session cookies working without TLS
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_ORIGIN: http://api:3001
        JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # Browser uses same-origin /api; Next rewrite proxies to the API service
      API_ORIGIN: http://api:3001
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      # Optional public hint (app uses relative /api; rewrite handles proxy)
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
